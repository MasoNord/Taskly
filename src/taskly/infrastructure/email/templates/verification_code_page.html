<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Код подтверждения</title>
</head>

<body style="margin:0;padding:0;background:#f4f6f9;font-family:Arial,Helvetica,sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" style="padding:40px 16px;">
    <tr>
        <td align="center">

            <table width="520" cellpadding="0" cellspacing="0"
                   style="
                        background:#ffffff;
                        border-radius:12px;
                        padding:36px;
                        box-shadow:0 4px 16px rgba(0,0,0,0.06);
                   ">

                <tr>
                    <td align="center">

                        <h1 style="
                            margin:0 0 16px 0;
                            font-size:24px;
                            color:#1f2937;
                            font-weight:700;
                        ">
                            Ваш код подтверждения для входа в систему
                        </h1>

                        <p style="
                            margin:0;
                            font-size:15px;
                            line-height:24px;
                            color:#6b7280;
                        ">
                            Для вас был сгенерирован код подтверждения введите его для входа в свой аккаунт
                        </p>

                        <div style="
                            margin:28px 0;
                            padding:18px;
                            background:#f3f4f6;
                            border-radius:10px;
                        ">

                            <div style="
                                font-size:13px;
                                color:#6b7280;
                                margin-bottom:8px;
                            ">
                                Ваш код
                            </div>

                            <div style="
                                font-size:28px;
                                font-weight:700;
                                color:#111827;
                                letter-spacing:3px;
                            ">
                                {{ verification_code }}
                            </div>

                        </div>
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
