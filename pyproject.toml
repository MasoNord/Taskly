[project]
name = "taskly"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosmtplib>=5.1.2",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "booktype>=1.5",
    "dishka>=1.10.1",
    "fastapi>=0.141.1",
    "gunicorn>=26.0.0",
    "jinja2>=3.1.6",
    "opentelemetry-distro>=0.65b0",
    "opentelemetry-exporter-otlp>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "pydantic[email]>=2.13.4",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.51",
    "starlette>=1.3.1",
    "structlog>=26.1.0",
    "toml-rs>=0.3.16",
    "uvicorn>=0.52.0",
]

[tool.uv]
package = true

[tool.mypy]
strict = true
warn_unreachable = true
show_column_numbers = true
show_error_context = true
check_untyped_defs = true
ignore_missing_imports = false
warn_no_return = true

[tool.ruff]
line-length = 120
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py"]
exclude = [
    "**/alembic/versions/**",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ['ALL']

ignore = [
    # Strange and obscure
    'D100',
    'D104',
    'D101',
    'D105',
    'D102',
    'RET504',
    'D103',
    'PLR0913',
    'S101',
    'EM101',
    'TRY003',
    'D107',
    'ARG002',
    'RUF001',
    'PLR0912',
    'C901',
    'PGH003',
    'RUF003',
    'TC002',
    'D205',
    'RUF002',
    'TC001',
    'FBT001',
    'FBT002',
    'SIM103',
    'LOG015',
    'TC003',
    # Does not work correctly
    'S104',
    'ANN401',
    'PLR2004',
]

[[project.authors]]
name = 'masonord'
email = 'trotf233@gmail.com'

[project.scripts]
server-run = "taskly.bootstrap.cli.server:run"
